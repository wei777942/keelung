function show(){if(isOpen)doClose();isOpen=true;sheet.className='sheet open';lockScroll();try{history.pushState({near:1},'');}catch(e){}}
function doClose(){if(!isOpen)return;isOpen=false;ticket++;sheet.className='sheet';unlockScroll();}
function close(){if(!isOpen)return;doClose();if(history.state&&history.state.near){skipPop=true;try{history.back();}catch(e){skipPop=false;}}}
window.addEventListener('popstate',function(){if(skipPop){skipPop=false;return;}if(isOpen)doClose();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.keyCode===27)close();});
function closeBtn(e){if(e){e.preventDefault();e.stopPropagation();}close();}
function openNear(){
 mode='near';cat="全部";here=null;from=null;title.textContent='📍 離我最近';
 chips.style.display='';chips.innerHTML=CHIPS.map(function(k){return '<button type="button" class="chip'+(k===cat?' on':'')+'" data-k="'+k+'">'+(IC[k]?IC[k]+' ':'')+k+'</button>';}).join('');
 show();locate();
}
function originBtns(again){var h='';for(var k in ORIG)h+='<button type="button" class="alt" data-o="'+k+'">'+ORIG[k].ic+' '+(again?'改':'')+'從'+ORIG[k].label+'算</button>';return h;}
function locate(){
 var t=++ticket;body.innerHTML='<p class="msg">正在找你的位置…</p>';
 if(!navigator.geolocation){denied('這支手機無法取得位置。');return;}
 navigator.geolocation.getCurrentPosition(function(p){if(t!==ticket||!isOpen)return;here=[p.coords.latitude,p.coords.longitude];from=null;render();},function(){if(t!==ticket||!isOpen)return;denied('');},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function denied(extra){body.innerHTML='<p class="msg warn"><b>請允許位置權限</b><br>'+(extra||'到手機設定允許這個網頁使用位置，再按一次「離我最近」。')+'</p><p class="msg">或從下面的地點開始算距離：</p>'+originBtns(false);}
function render(){
 var list=P.map(function(p){return{p:p,d:dist(here[0],here[1],p.y,p.x)};}).sort(function(a,b){return a.d-b.d;});
 var far=list.length&&list[0].d>FAR;
 var f=list.filter(function(o){return cat==="全部"||o.p.c.indexOf(cat)>=0;}).slice(0,10);
 var h='';
 if(from)h+='<p class="msg">'+ORIG[from].ic+' 從<b>'+ORIG[from].n+'</b>算的距離。</p>';
 else if(far)h+='<p class="msg warn">'+S.farMsg+'</p>';
 h+=f.map(function(o){var p=o.p;var m=o.d<=WALK?'walking':S.mode;var u='https://www.google.com/maps/dir/?api=1&destination='+p.y+','+p.x+'&travelmode='+m;
  return '<a class="row" href="'+u+'" target="_blank" rel="noopener"><span class="ri">'+IC[p.c[0]]+'</span><span class="rm"><span class="rn">'+esc(p.n)+'<span class="rarea">'+esc(p.a)+'</span></span><span class="rnote">'+esc(p.t)+'</span></span><span class="rd">'+fmt(o.d)+'<small>'+(o.d<=WALK?'🚶 步行':S.modeLabel)+'</small></span></a>';}).join('');
 if(!f.length)h+='<p class="msg">這個類別沒有點。</p>';
 h+=originBtns(true);
 body.innerHTML=h;body.scrollTop=0;
}
function openList(c){
 mode='list';var anyH=L[c].some(function(r){return r.h;});title.textContent=IC[c]+' '+c+(anyH?'（⭐ 重點推薦在前）':'');chips.style.display='none';chips.innerHTML='';
 var h='<p class="msg">點一下就在 Google 地圖打開。</p>'+L[c].map(function(r){var u='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.q);
  return '<a class="row" href="'+u+'" target="_blank" rel="noopener"><span class="ri">'+(r.h?'⭐':IC[c])+'</span><span class="rm"><span class="rn">'+esc(r.n)+'<span class="rarea">'+esc(r.a)+'</span></span><span class="rnote">'+esc(r.t)+'</span></span></a>';}).join('');
 show();body.innerHTML=h;body.scrollTop=0;
}
body.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-o]');if(!b)return;e.preventDefault();from=b.getAttribute('data-o');here=ORIG[from].p;render();});
chips.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;cat=b.getAttribute('data-k');[].forEach.call(chips.children,function(x){x.classList.toggle('on',x===b);});if(here)render();});
document.getElementById('sx').addEventListener('click',closeBtn);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeBtn(e);});
document.querySelector('.near').addEventListener('click',openNear);
var MP=window.MAPS||{};
[].forEach.call(document.querySelectorAll('.btn[data-cat]'),function(a){var c=a.getAttribute('data-cat');
 if(MP[c]){a.href=MP[c];a.target='_blank';a.rel='noopener';a.removeAttribute('role');}
 else a.addEventListener('click',function(e){e.preventDefault();openList(c);});});
})();
</script>
</body></html>
